<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fik AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #1b1b1b;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      height: calc(100vh - 130px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      padding: 12px;
      margin: 8px 0;
      border-radius: 12px;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .user {
      background: #333;
      margin-left: auto;
    }

    .ai {
      background: #222;
      margin-right: auto;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      padding: 10px;
      box-sizing: border-box;
      background: #1b1b1b;
    }

    input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    button {
      margin-left: 8px;
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>🤖 Fik AI</header>

<div id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Tulis pesan..." />
  <button onclick="sendMessage()">Kirim</button>
</div>

<script>

const API_KEY = "AQ.Ab8RN6IsWSdKksvsi31lbKdeA8DlYhKW9XC0z_naYGsjk7PcwA";

async function sendMessage() {

  const input = document.getElementById("input");
  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  addMessage("⏳ Bentar lek kuu...", "ai");

  try {

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + API_KEY,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: message
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    document.querySelector(".ai:last-child").remove();

    if (data.candidates) {
      const reply =
        data.candidates[0].content.parts[0].text;

      addMessage(reply, "ai");
    } else {
      addMessage("❌ Error: " + JSON.stringify(data), "ai");
    }

  } catch (error) {

    document.querySelector(".ai:last-child").remove();

    addMessage("❌ Gagal terhubung ke AI.", "ai");

    console.log(error);
  }
}

function addMessage(text, type) {

  const chat = document.getElementById("chat");

  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
